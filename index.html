<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>متجر الأجهزة الذكية</title>
    <!-- رابط مكتبة أيقونات Font Awesome -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- ربط ملف الستايل الخارجي -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- الشاشة الرئيسية للمتجر -->
    <div class="app-container">
        
        <!-- الشريط العلوي (الهيدر) -->
        <header class="app-header">
            <h1>متجر الإلكترونيات</h1>
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="ابحث عن أجهزة، إكسسوارات...">
            </div>
        </header>

        <!-- المحتوى الرئيسي للمتجر -->
        <main class="main-content">
            <!-- قسم الفئات (Categories) بأسلوب التمرير الأفقي مثل الآيفون -->
            <section class="categories-section">
                <div class="section-title">الأقسام</div>
                <div class="categories-scroll">
                    <div class="category-item active"><i class="fas fa-mobile-alt"></i><span>هواتف</span></div>
                    <div class="category-item"><i class="fas fa-laptop"></i><span>لابتوب</span></div>
                    <div class="category-item"><i class="fas fa-headphones"></i><span>صوتيات</span></div>
                    <div class="category-item"><i class="fas fa-tablet-alt"></i><span>تابلت</span></div>
                    <div class="category-item"><i class="fas fa-clock"></i><span>ساعات</span></div>
                </div>
            </section>

            <!-- قسم المنتجات -->
            <section class="products-section">
                <div class="section-title">أحدث الأجهزة</div>
                <div class="products-grid">
                    
                    <!-- المنتج الأول -->
                    <div class="product-card">
                        <div class="badge">جديد</div>
                        <div class="product-image">
                            <i class="fas fa-mobile-alt" style="font-size: 80px; color: #007aff;"></i>
                        </div>
                        <div class="product-info">
                            <h3 class="product-title">هاتف ذكي بريميوم 16</h3>
                            <p class="product-price">999 $</p>
                            <button class="add-to-cart-btn" onclick="addToCart()">إضافة للسلة</button>
                        </div>
                    </div>

                    <!-- المنتج الثاني -->
                    <div class="product-card">
                        <div class="product-image">
                            <i class="fas fa-headphones" style="font-size: 80px; color: #34c759;"></i>
                        </div>
                        <div class="product-info">
                            <h3 class="product-title">سماعات رأس عازلة للصوت</h3>
                            <p class="product-price">299 $</p>
                            <button class="add-to-cart-btn" onclick="addToCart()">إضافة للسلة</button>
                        </div>
                    </div>

                    <!-- المنتج الثالث -->
                    <div class="product-card">
                        <div class="product-image">
                            <i class="fas fa-laptop" style="font-size: 80px; color: #ff9500;"></i>
                        </div>
                        <div class="product-info">
                            <h3 class="product-title">حاسوب محمول فائق النحافة</h3>
                            <p class="product-price">1499 $</p>
                            <button class="add-to-cart-btn" onclick="addToCart()">إضافة للسلة</button>
                        </div>
                    </div>

                    <!-- المنتج الرابع -->
                    <div class="product-card">
                        <div class="product-image">
                            <i class="fas fa-clock" style="font-size: 80px; color: #af52de;"></i>
                        </div>
                        <div class="product-info">
                            <h3 class="product-title">ساعة ذكية رياضية</h3>
                            <p class="product-price">199 $</p>
                            <button class="add-to-cart-btn" onclick="addToCart()">إضافة للسلة</button>
                        </div>
                    </div>

                </div>
            </section>
        </main>

        <!-- شريط التنقل السفلي المثبت (iOS Tab Bar) -->
        <nav class="bottom-nav">
            <a href="#" class="nav-item active">
                <i class="fas fa-home"></i>
                <span>الرئيسية</span>
            </a>
            <a href="#" class="nav-item">
                <i class="fas fa-th-large"></i>
                <span>الأقسام</span>
            </a>
            <a href="#" class="nav-item font-basket">
                <i class="fas fa-shopping-basket"></i>
                <span class="cart-badge" id="cartBadge">0</span>
                <span>السلة</span>
            </a>
            <a href="#" class="nav-item">
                <i class="fas fa-user"></i>
                <span>حسابي</span>
            </a>
        </nav>

    </div>

    <!-- كود الجافا سكريبت البسيط للتفاعل -->
    <script>
        let cartCount = 0;
        function addToCart() {
            cartCount++;
            document.getElementById('cartBadge').innerText = cartCount;
            
            // إشعار بسيط عند إضافة منتج
            alert("تم إضافة المنتج إلى السلة بنجاح! 🛒");
        }
    </script>
</body>
</html>
